<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- High Dynamic Range Electric Radial Glow at 56% 41.7% (560, 417) -->
    <radialGradient id="electricCore" cx="56%" cy="41.7%" r="45%" fx="56%" fy="41.7%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="3%" stop-color="#F8FAFC" stop-opacity="0.95" />
      <stop offset="8%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="18%" stop-color="#00F0FF" stop-opacity="0.85" />
      <stop offset="32%" stop-color="#FF9F0A" stop-opacity="0.75" />
      <stop offset="52%" stop-color="#FF1464" stop-opacity="0.5" />
      <stop offset="75%" stop-color="#7928CA" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#05070B" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Electric Discharge Streaks -->
    <linearGradient id="electricStreak1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="56%" stop-color="#FF9F0A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF1464" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="electricStreak2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1464" stop-opacity="0" />
      <stop offset="41.7%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="electricGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="1000" fill="transparent" />

  <!-- Core Electric Radial Field -->
  <rect width="1000" height="1000" fill="url(#electricCore)" />

  <!-- Lightning & Plasma Arcs focused at (560, 417) -->
  <g filter="url(#electricGlow)">
    <!-- Electric Cross Discharges -->
    <path d="M100 417 H900" stroke="url(#electricStreak1)" stroke-width="6" stroke-linecap="round" />
    <path d="M560 50 V950" stroke="url(#electricStreak2)" stroke-width="6" stroke-linecap="round" />
    
    <!-- Diagonal Arc Beams intersecting at focal point -->
    <path d="M200 150 Q 560 417 920 680" stroke="url(#electricStreak1)" stroke-width="4" fill="none" />
    <path d="M850 120 Q 560 417 180 820" stroke="url(#electricStreak2)" stroke-width="4" fill="none" />
    
    <!-- Concentric Electric Energy Rings -->
    <ellipse cx="560" cy="417" rx="120" ry="80" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.8" />
    <ellipse cx="560" cy="417" rx="260" ry="170" stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.6" />
    <ellipse cx="560" cy="417" rx="420" ry="280" stroke="#FF9F0A" stroke-width="1.5" fill="none" opacity="0.4" />
    
    <!-- Electric Sparks around 56%, 41.7% -->
    <circle cx="560" cy="417" r="16" fill="#FFFFFF" />
    <circle cx="560" cy="417" r="32" fill="#00F0FF" opacity="0.5" />
    <circle cx="590" cy="400" r="4" fill="#FFFFFF" />
    <circle cx="530" cy="435" r="5" fill="#FF9F0A" />
    <circle cx="575" cy="450" r="3" fill="#38BDF8" />
    <circle cx="540" cy="385" r="4" fill="#FFFFFF" />
  </g>
</svg>
