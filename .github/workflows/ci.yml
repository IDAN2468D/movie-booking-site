name: CinePulse Full CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-quality-gate:
    name: Typecheck, Lint, Tests & Production Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Cache Next.js build artifacts
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.next/cache
        key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

    - name: Install dependencies
      run: npm install --include=dev

    - name: TypeScript Static Type Verification
      run: npx tsc --noEmit

    - name: Code Quality & ESLint Check
      run: npm run lint

    - name: Run Unit Tests (Vitest)
      run: npx vitest run
      env:
        NEXTAUTH_SECRET: 'ci-dummy-secret-12345678901234567890'
        NEXTAUTH_URL: 'http://localhost:3000'
        GOOGLE_CLIENT_ID: 'ci-dummy'
        GOOGLE_CLIENT_SECRET: 'ci-dummy'
        MONGODB_URI: 'mongodb://localhost:27017/cinepulse_ci'
        JWT_SECRET: 'ci-dummy-jwt-secret-12345678901234567890'
        RESEND_API_KEY: 're_dummy_ci_key'
        TMDB_API_KEY: 'ci-dummy-key'

    - name: Compile Next.js Production Build
      run: npm run build
      env:
        NEXTAUTH_SECRET: 'ci-dummy-secret-12345678901234567890'
        NEXTAUTH_URL: 'http://localhost:3000'
        GOOGLE_CLIENT_ID: 'ci-dummy'
        GOOGLE_CLIENT_SECRET: 'ci-dummy'
        MONGODB_URI: 'mongodb://localhost:27017/cinepulse_ci'
        JWT_SECRET: 'ci-dummy-jwt-secret-12345678901234567890'
        RESEND_API_KEY: 're_dummy_ci_key'
        TMDB_API_KEY: 'ci-dummy-key'

